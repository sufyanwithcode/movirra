services:
  postgres:
    image: postgres:16-alpine
    container_name: movirra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movirra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movirra}
      POSTGRES_DB: ${POSTGRES_DB:-movirra}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movirra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: movirra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # Application services below activate in their phases (Dockerfiles land
  # in Phase 16). Uncomment once apps/api, apps/web, apps/worker are built.
  # ---------------------------------------------------------------------
  # api:
  #   build: { context: ., dockerfile: docker/backend.Dockerfile }
  #   env_file: .env
  #   depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  #   ports: ["4000:4000"]
  #
  # worker:
  #   build: { context: ., dockerfile: docker/worker.Dockerfile }
  #   env_file: .env
  #   depends_on: { redis: { condition: service_healthy } }
  #
  # web:
  #   build: { context: ., dockerfile: docker/frontend.Dockerfile }
  #   env_file: .env
  #   depends_on: [api]
  #   ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
